name: Backend unit tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-unit-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-unit-tests:
    name: Backend offline suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-test.txt

      - name: Run every offline backend test module
        run: python -m backend.run_offline_tests
